<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8BCF4E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pistache">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Les histoires de Pistache</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Andika:wght@400;700&display=swap">
<style>
/* Livre d'images plein écran : une scène illustrée, une phrase en grosses lettres, deux énormes flèches. Look unique, chaud, assumé. */
:root{
  --ciel:#BFE3F2; --nuit:#26305C; --herbe:#7CC46A; --herbe2:#5BA552;
  --pistache:#8BCF4E; --pistache-f:#4E9A2C; --soleil:#FFC93C; --corail:#FF7A59;
  --papier:#FFF8EC; --encre:#2B2A3D; --doux:#6B6880;
  --display:"Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --lecture:"Andika","Verdana",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--papier);color:var(--encre);font-family:var(--lecture);padding-inline:16px;-webkit-tap-highlight-color:transparent;user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible{outline:4px solid var(--corail);outline-offset:3px}
.app{max-width:960px;margin:0 auto;padding-block:16px 24px;display:flex;flex-direction:column;gap:16px;min-height:100%;box-sizing:border-box}

/* Accueil */
.tete{display:flex;align-items:center;gap:14px}
.tete svg{width:84px;height:84px;flex:none}
h1{font-family:var(--display);font-weight:700;font-size:clamp(2rem,6vw,3.2rem);line-height:1;margin:0;color:var(--pistache-f);text-wrap:balance}
.tete p{margin:.25rem 0 0;color:var(--doux);font-size:1.05rem}
.etageres{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.livre{display:flex;flex-direction:column;background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 6px 0 rgba(43,42,61,.12);text-align:left;transition:transform .15s}
.livre:hover{transform:translateY(-3px) rotate(-.6deg)}
.livre:active{transform:scale(.97)}
.livre svg{display:block;width:100%;height:auto;aspect-ratio:16/10}
.livre span{font-family:var(--display);font-weight:600;font-size:1.35rem;padding:12px 16px 16px;line-height:1.15}
.livre small{display:block;font-family:var(--lecture);font-weight:400;font-size:.9rem;color:var(--doux);margin-top:4px}
.astuce{color:var(--doux);font-size:.95rem;margin:0;text-align:center}

/* Lecture */
.lecture{display:flex;flex-direction:column;gap:14px;flex:1}
.barre{display:flex;align-items:center;justify-content:space-between;gap:10px}
.rond{width:56px;height:56px;border-radius:50%;background:#fff;box-shadow:0 4px 0 rgba(43,42,61,.14);display:grid;place-items:center;font-size:1.6rem;flex:none}
.rond svg{width:28px;height:28px}
.rond.actif{background:var(--soleil)}
.points{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.points i{width:14px;height:14px;border-radius:50%;background:#E4DCCB;transition:background .2s,transform .2s}
.points i.on{background:var(--corail);transform:scale(1.25)}
.scene{position:relative;border-radius:26px;overflow:hidden;box-shadow:0 8px 0 rgba(43,42,61,.12);background:var(--ciel)}
.scene svg{display:block;width:100%;height:auto;aspect-ratio:16/10;max-width:100%}
.scene .touche{cursor:pointer}
.texte{font-size:clamp(1.35rem,3.6vw,2rem);line-height:1.45;margin:0;text-align:center;min-height:3em;text-wrap:balance;padding-inline:4px}
.texte .mot.lu{color:var(--corail)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:12px}
.fleche{width:84px;height:84px;border-radius:50%;background:var(--pistache);box-shadow:0 6px 0 var(--pistache-f);display:grid;place-items:center;transition:transform .1s}
.fleche:active{transform:translateY(4px);box-shadow:0 2px 0 var(--pistache-f)}
.fleche[disabled]{opacity:.3}
.fleche svg{width:40px;height:40px}
.lire{font-family:var(--display);font-weight:600;font-size:1.25rem;background:var(--soleil);border-radius:999px;padding:16px 26px;box-shadow:0 5px 0 #D9A41E;display:flex;align-items:center;gap:10px}
.lire svg{width:26px;height:26px}
.fin{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

@keyframes flotte{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes saute{0%{transform:translateY(0) scale(1)}40%{transform:translateY(-18px) scale(1.06)}100%{transform:translateY(0) scale(1)}}
@keyframes scintille{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes bulle{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-60px);opacity:0}}
.flotte{animation:flotte 3s ease-in-out infinite;transform-box:fill-box}
.saute{animation:saute .5s ease-out;transform-box:fill-box;transform-origin:center bottom}
.etoile{animation:scintille 2.4s ease-in-out infinite}
.bulle{animation:bulle 1.4s ease-out forwards;transform-box:fill-box}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:520px){.fleche{width:68px;height:68px}.lire{padding:14px 18px;font-size:1.1rem}}
</style>

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)} img{max-width:100%} [hidden]{display:none!important} body{overscroll-behavior:none}</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
/* ---------- Dessins (formes simples, personnages originaux) ---------- */
const C={herbe:'#7CC46A',herbe2:'#5BA552',pist:'#8BCF4E',pistF:'#4E9A2C',ventre:'#F6E7A6',sol:'#FFC93C',cor:'#FF7A59',enc:'#2B2A3D',blanc:'#fff'};

function teinte(h,a){const n=parseInt(h.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const t=a<0?0:255,p=Math.abs(a);r=Math.round(r+(t-r)*p);g=Math.round(g+(t-g)*p);b=Math.round(b+(t-b)*p);return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);}
function melange(h1,h2,t){const a=parseInt(h1.slice(1),16),b=parseInt(h2.slice(1),16);const f=s=>[(s>>16),(s>>8&255),(s&255)];const A=f(a),B=f(b);return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('');}
function oeil(cx,cy,r,{iris='gIris',cils=false}={}){
  return `<ellipse cx="${cx}" cy="${cy}" rx="${r}" ry="${(r*1.2).toFixed(1)}" fill="#fff"/>
  <circle cx="${(cx+r*.15).toFixed(1)}" cy="${(cy+r*.2).toFixed(1)}" r="${(r*.72).toFixed(1)}" fill="url(#${iris})"/>
  <circle cx="${(cx+r*.18).toFixed(1)}" cy="${(cy+r*.24).toFixed(1)}" r="${(r*.38).toFixed(1)}" fill="#1B1626"/>
  <circle cx="${(cx-r*.12).toFixed(1)}" cy="${(cy-r*.25).toFixed(1)}" r="${(r*.3).toFixed(1)}" fill="#fff"/>
  <circle cx="${(cx+r*.45).toFixed(1)}" cy="${(cy+r*.55).toFixed(1)}" r="${(r*.13).toFixed(1)}" fill="#fff" opacity=".85"/>
  <path d="M${(cx-r*.95).toFixed(1)} ${(cy-r*.35).toFixed(1)} Q${cx} ${(cy-r*1.62).toFixed(1)} ${(cx+r*.95).toFixed(1)} ${(cy-r*.35).toFixed(1)}" stroke="#2B2A3D" stroke-width="${(r*.16).toFixed(1)}" fill="none" stroke-linecap="round" opacity=".8"/>
  ${cils?`<path d="M${cx+r*.9} ${cy-r*.75} l${r*.45} ${-r*.35} M${cx+r*.55} ${cy-r*1.05} l${r*.3} ${-r*.45}" stroke="#2B2A3D" stroke-width="${(r*.22).toFixed(1)}" stroke-linecap="round"/>`:''}`;
}
const oeilFerme=(cx,cy,r)=>`<path d="M${cx-r} ${cy} q${r} ${r*.9} ${2*r} 0" stroke="#2B2A3D" stroke-width="${(r*.3).toFixed(1)}" fill="none" stroke-linecap="round"/><path d="M${cx-r*.7} ${cy+r*.45} l-${r*.3} ${r*.35} M${cx} ${cy+r*.65} v${r*.4} M${cx+r*.7} ${cy+r*.45} l${r*.3} ${r*.35}" stroke="#2B2A3D" stroke-width="${(r*.2).toFixed(1)}" stroke-linecap="round"/>`;
const ombreSol=(cx,cy,rx)=>`<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${(rx*.16).toFixed(1)}" fill="#1E2A10" opacity=".2"/>`;
function dragon(x,y,s=1,{yeux='ouverts',flamme=false,ailes=true,hoquet=false}={}){
  const o = yeux==='fermes' ? oeilFerme(37,-40,10) : oeil(37,-42,11,{iris:'gIrisD'});
  const feu = flamme ? `<g transform="translate(70,-22)"><path d="M0 0 q20 -18 40 -4 q-8 5 -2 10 q-20 10 -38 -6z" fill="url(#gFeu)"/><path d="M4 0 q12 -8 22 0 q-12 6 -22 0z" fill="#FFF3B0"/><circle cx="30" cy="-2" r="16" fill="url(#gHalo)"/></g>`:'';
  const hic = hoquet ? `<g transform="translate(72,-32)"><circle r="5" fill="url(#gHalo)"/><circle r="3.5" fill="#FFE27A"/><circle cx="12" cy="-9" r="3" fill="#FF8A5C"/><circle cx="6" cy="-20" r="2.5" fill="#FFE27A"/></g>`:'';
  return `<g class="touche dragon" data-son="dragon" transform="translate(${x},${y}) scale(${s})">
    ${ombreSol(-4,40,54)}
    <g class="corps">
    <path d="M-40 10 q-42 12 -56 -12 q16 8 24 -2" fill="url(#gPist)" stroke="#4E8F2C" stroke-width="2.5"/>
    <path d="M-96 -2 l-10 -14 l17 5z" fill="url(#gCrete)"/>
    ${ailes?`<path d="M-14 -30 q-32 -50 -58 -32 q15 5 11 15 q13 -2 15 11 q13 -4 32 6z" fill="url(#gAile)" stroke="#4E8F2C" stroke-width="2.5"/><path d="M-30 -40 q-12 -8 -26 -14 M-24 -32 q-10 -2 -24 0" stroke="#7DBB4E" stroke-width="2" fill="none" opacity=".7"/>`:''}
    <ellipse cx="-6" cy="0" rx="44" ry="35" fill="url(#gPist)" stroke="#4E8F2C" stroke-width="2.5"/>
    <ellipse cx="2" cy="7" rx="26" ry="23" fill="url(#gVentre)"/>
    <path d="M-8 18 q7 3 14 0 M-9 6 q8 3 16 0 M-7 -6 q7 3 13 0" stroke="#E0BE62" stroke-width="2" fill="none" stroke-linecap="round"/>
    <ellipse cx="-24" cy="-18" rx="16" ry="7" fill="#fff" opacity=".22" transform="rotate(-25 -24 -18)"/>
    <rect x="-34" y="22" width="17" height="17" rx="8" fill="url(#gPist)" stroke="#4E8F2C" stroke-width="2.5"/>
    <rect x="8" y="22" width="17" height="17" rx="8" fill="url(#gPist)" stroke="#4E8F2C" stroke-width="2.5"/>
    <path d="M6 -50 l-4 -19 l12 10 l4 -17 l9 17 l10 -9 l-2 19z" fill="url(#gCrete)"/>
    <ellipse cx="38" cy="-33" rx="36" ry="30" fill="url(#gPist)" stroke="#4E8F2C" stroke-width="2.5"/>
    <ellipse cx="26" cy="-52" rx="15" ry="6" fill="#fff" opacity=".28" transform="rotate(-18 26 -52)"/>
    <path d="M20 -60 q-5 -15 6 -20 q0 11 5 18z" fill="url(#gCorne)" stroke="#C99021" stroke-width="1.5"/>
    <path d="M45 -62 q2 -15 13 -15 q-4 9 -2 17z" fill="url(#gCorne)" stroke="#C99021" stroke-width="1.5"/>
    ${o}
    <ellipse cx="64" cy="-28" rx="2.4" ry="1.8" fill="#3F7A22"/>
    <path d="M44 -15 q11 8 22 -2" stroke="#2B2A3D" stroke-width="2.8" fill="none" stroke-linecap="round"/>
    <ellipse cx="22" cy="-22" rx="8" ry="5" fill="#FF8C7A" opacity=".45"/>
    </g>${feu}${hic}</g>`;
}
function chienne(x,y,s=1,{casque=false}={}){
  return `<g class="touche" data-son="ouaf" transform="translate(${x},${y}) scale(${s})">
    ${ombreSol(2,40,40)}
    <path d="M-30 4 q-20 -10 -21 -26" stroke="url(#gChien)" stroke-width="8" fill="none" stroke-linecap="round"/>
    <ellipse cx="0" cy="8" rx="34" ry="24" fill="url(#gChien)" stroke="#A9682F" stroke-width="2.5"/>
    <ellipse cx="4" cy="14" rx="18" ry="12" fill="#FCE6C8" opacity=".9"/>
    <rect x="-24" y="20" width="12" height="19" rx="6" fill="url(#gChien)" stroke="#A9682F" stroke-width="2.5"/>
    <rect x="12" y="20" width="12" height="19" rx="6" fill="url(#gChien)" stroke="#A9682F" stroke-width="2.5"/>
    <circle cx="24" cy="-22" r="27" fill="url(#gChien)" stroke="#A9682F" stroke-width="2.5"/>
    <ellipse cx="14" cy="-38" rx="11" ry="5" fill="#fff" opacity=".25" transform="rotate(-20 14 -38)"/>
    <ellipse cx="39" cy="-13" rx="15" ry="11" fill="#FCE6C8"/>
    <ellipse cx="50" cy="-19" rx="5.5" ry="4.2" fill="#2B2A3D"/><ellipse cx="48.5" cy="-20.5" rx="1.8" ry="1.1" fill="#fff" opacity=".7"/>
    <path d="M3 -42 q-18 0 -14 30 q11 -5 16 -20z" fill="#8A4F22"/>
    <path d="M36 -46 q15 -9 20 7 q-9 2 -15 4z" fill="#8A4F22"/>
    ${oeil(28,-29,6.5)}
    <path d="M38 -5 q5 9 12 2" stroke="#2B2A3D" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <path d="M42 -3 q2 6 5 1z" fill="#FF7A8A"/>
    <ellipse cx="22" cy="-12" rx="6" ry="4" fill="#FF8C7A" opacity=".35"/>
    <path d="M12 -2 q12 6 24 0" stroke="#3E7BD6" stroke-width="6" fill="none" stroke-linecap="round"/>
    <circle cx="24" cy="4" r="5" fill="url(#gCorne)" stroke="#C99021" stroke-width="1.5"/>
    ${casque?`<path d="M2 -42 q20 -30 48 -6 z" fill="url(#gFeu)" stroke="#C9553A" stroke-width="2"/><ellipse cx="22" cy="-52" rx="8" ry="3" fill="#fff" opacity=".4"/>`:''}
  </g>`;
}
function chaton(x,y,s=1){
  return `<g class="touche" data-son="miaou" transform="translate(${x},${y}) scale(${s})">
    ${ombreSol(0,20,18)}
    <path d="M14 6 q15 -4 13 -19" stroke="url(#gChat)" stroke-width="5" fill="none" stroke-linecap="round"/>
    <ellipse cx="0" cy="8" rx="16" ry="12" fill="url(#gChat)" stroke="#8C92A1" stroke-width="1.5"/>
    <path d="M-17 -16 l2 -13 l9 8z M5 -16 l-2 -13 l-9 8z" fill="url(#gChat)" stroke="#8C92A1" stroke-width="1.5"/>
    <path d="M-14 -18 l1 -6 l4 4z M3 -18 l-1 -6 l-4 4z" fill="#FFB3C1"/>
    <circle cx="-6" cy="-10" r="14" fill="url(#gChat)" stroke="#8C92A1" stroke-width="1.5"/>
    ${oeil(-11,-11,3.6,{iris:'gIrisC'})}${oeil(-1,-11,3.6,{iris:'gIrisC'})}
    <path d="M-7.5 -4.5 l1.5 1.2 l1.5 -1.2z" fill="#FF8FA3"/>
    <path d="M-9 -2 q3 3 6 0" stroke="#2B2A3D" stroke-width="1.3" fill="none"/>
  </g>`;
}
const fond=(ciel='#BFE3F2',sol=C.herbe)=>{
  const k=(ciel+sol).replace(/#/g,''); const nuit=parseInt(ciel.slice(1,3),16)<80;
  const loin=melange(sol,ciel,.55), milieu=teinte(C.herbe2,nuit?-.35:0);
  const fleurs=nuit?'':[[40,372,'#FF8FAF'],[95,388,'#FFE27A'],[160,366,'#fff'],[250,392,'#FF8FAF'],[330,370,'#FFE27A'],[420,390,'#fff'],[505,374,'#FF8FAF'],[590,386,'#FFE27A']].map(([fx,fy,c])=>`<g transform="translate(${fx},${fy})"><circle r="3.2" cx="-3" fill="${c}"/><circle r="3.2" cx="3" fill="${c}"/><circle r="3.2" cy="-3" fill="${c}"/><circle r="3.2" cy="3" fill="${c}"/><circle r="2.2" fill="#FFC93C"/></g>`).join('');
  const herbes=[20,70,130,190,240,300,360,410,470,530,580,620].map((hx,i)=>`<path d="M${hx} ${380+i%3*6} q2 -12 6 -16 M${hx+5} ${382+i%3*6} q1 -9 -3 -13" stroke="${teinte(sol,-.25)}" stroke-width="2" fill="none" stroke-linecap="round" opacity=".7"/>`).join('');
  return `<defs><linearGradient id="ciel${k}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${melange(ciel,nuit?'#0E1230':'#4A9BE0',.4)}"/><stop offset=".55" stop-color="${ciel}"/><stop offset=".85" stop-color="${melange(ciel,nuit?'#6A5A9A':'#FFF1D2',.55)}"/></linearGradient>
  <linearGradient id="sol${k}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${teinte(sol,.15)}"/><stop offset="1" stop-color="${teinte(sol,-.22)}"/></linearGradient></defs>
  <rect width="640" height="400" fill="url(#ciel${k})"/>
  <path d="M0 265 q90 -45 200 -20 q120 -60 240 -10 q110 -30 200 5 V400 H0z" fill="${loin}" opacity=".85"/>
  <path d="M0 300 q160 -62 320 -10 t320 -20 V400 H0z" fill="${milieu}"/>
  <path d="M0 300 q160 -62 320 -10 t320 -20" stroke="#fff" stroke-opacity=".18" stroke-width="3" fill="none"/>
  <path d="M0 330 q200 -42 400 0 t240 -10 V400 H0z" fill="url(#sol${k})"/>
  ${fleurs}`;
};
const soleil=(x=560,y=70)=>`<g class="touche" data-son="ding"><circle cx="${x}" cy="${y}" r="120" fill="url(#gHalo)" opacity=".7"/><g opacity=".12">${[0,45,90,135,180,225,270,315].map(a=>`<path d="M${x} ${y} l${(Math.cos(a*Math.PI/180)*70).toFixed(0)} ${(Math.sin(a*Math.PI/180)*70).toFixed(0)}" stroke="#FFF3B0" stroke-width="10" stroke-linecap="round"/>`).join('')}</g><circle cx="${x}" cy="${y}" r="36" fill="url(#gSoleil)"/></g>`;
const couchant=(x)=>`<circle cx="${x}" cy="215" r="130" fill="url(#gHalo)"/><circle cx="${x}" cy="222" r="44" fill="url(#gSoleil)"/><path d="M0 265 q90 -45 200 -20 q120 -60 240 -10 q110 -30 200 5 V400 H0z" fill="#E9B98A" opacity=".9"/><path d="M0 300 q160 -62 320 -10 t320 -20 V400 H0z" fill="#6FA552"/><path d="M0 330 q200 -42 400 0 t240 -10 V400 H0z" fill="#7CC46A"/>`;
const lune=(x=540,y=70)=>`<circle cx="${x}" cy="${y}" r="90" fill="url(#gHaloLune)"/><mask id="mlune${x}${y}"><circle cx="${x}" cy="${y}" r="32" fill="#fff"/><circle cx="${x+14}" cy="${y-8}" r="28" fill="#000"/></mask><circle cx="${x}" cy="${y}" r="32" fill="#FFF3C4" mask="url(#mlune${x}${y})"/>`;
const etoiles=()=>[[60,50],[140,90],[230,40],[330,80],[420,30],[470,110],[90,140],[280,130],[600,150],[180,20],[380,150],[30,110]].map(([x,y],i)=>`<g class="etoile" style="animation-delay:${i*.3}s"><circle cx="${x}" cy="${y}" r="${7+i%3*2}" fill="url(#gHaloLune)"/><path d="M${x} ${y-5-i%3} L${x+1.3} ${y-1.3} L${x+5+i%3} ${y} L${x+1.3} ${y+1.3} L${x} ${y+5+i%3} L${x-1.3} ${y+1.3} L${x-5-i%3} ${y} L${x-1.3} ${y-1.3}z" fill="#FFF6D2"/></g>`).join('');
const nuage=(x,y,s=1)=>`<g class="flotte" transform="translate(${x},${y}) scale(${s})"><g fill="url(#gNuage)"><ellipse cx="0" cy="2" rx="44" ry="18"/><ellipse cx="-24" cy="-8" rx="22" ry="17"/><ellipse cx="18" cy="-14" rx="25" ry="21"/><ellipse cx="38" cy="-2" rx="16" ry="12"/></g><ellipse cx="10" cy="-24" rx="12" ry="5" fill="#fff" opacity=".8"/></g>`;
const arbre=(x,y,s=1)=>`<g transform="translate(${x},${y}) scale(${s})">${ombreSol(0,132,80)}<path d="M-14 130 q-4 -70 2 -140 h24 q6 70 2 140z" fill="url(#gTronc)"/><path d="M8 20 l40 -30" stroke="#8A5A30" stroke-width="12" stroke-linecap="round"/><circle cx="-50" cy="-20" r="46" fill="url(#gFeuille)"/><circle cx="50" cy="-30" r="50" fill="url(#gFeuille)"/><circle cx="0" cy="-62" r="72" fill="url(#gFeuille)"/><ellipse cx="-24" cy="-100" rx="30" ry="14" fill="#fff" opacity=".16"/>${[[-20,-80],[34,-70],[-56,-30],[60,-10],[10,-30]].map(([a,b])=>`<circle cx="${a}" cy="${b}" r="9" fill="url(#gFeu)"/><circle cx="${a-3}" cy="${b-3}" r="2.5" fill="#fff" opacity=".7"/>`).join('')}</g>`;

/* ---------- Sons (synthétisés, aucun fichier) ---------- */
let ac;
function son(type){
  try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended') ac.resume(); }catch(e){return}
  const t=ac.currentTime, o=ac.createOscillator(), g=ac.createGain(); o.connect(g); g.connect(ac.destination);
  const env=(a,d)=>{g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(a,t+.03);g.gain.exponentialRampToValueAtTime(0.0001,t+d)};
  if(type==='dragon'){o.type='sawtooth';o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(70,t+.6);env(.25,.7);o.start(t);o.stop(t+.75)}
  else if(type==='ouaf'){o.type='square';o.frequency.setValueAtTime(380,t);o.frequency.exponentialRampToValueAtTime(180,t+.15);env(.2,.2);o.start(t);o.stop(t+.22)}
  else if(type==='miaou'){o.type='triangle';o.frequency.setValueAtTime(600,t);o.frequency.linearRampToValueAtTime(900,t+.2);o.frequency.linearRampToValueAtTime(500,t+.5);env(.25,.55);o.start(t);o.stop(t+.6)}
  else {o.type='sine';o.frequency.setValueAtTime(880,t);o.frequency.setValueAtTime(1320,t+.12);env(.2,.4);o.start(t);o.stop(t+.45)}
}

/* ---------- Voix ---------- */
const parle = 'speechSynthesis' in window;
let voixFR=null;
function choisirVoix(){ if(!parle) return; const v=speechSynthesis.getVoices(); voixFR=v.find(x=>/^fr(-|_)FR/i.test(x.lang))||v.find(x=>/^fr/i.test(x.lang))||null; }
if(parle){ choisirVoix(); speechSynthesis.onvoiceschanged=choisirVoix; }
let enCours=null, voixDebloquee=false;
function debloquerVoix(){ // iPhone/iPad : la voix doit démarrer pendant un toucher
  if(!parle||voixDebloquee) return; voixDebloquee=true;
  try{ const u=new SpeechSynthesisUtterance(' '); u.volume=0; u.lang='fr-FR'; speechSynthesis.speak(u);}catch(e){}
}
function avertir(msg){
  let b=document.getElementById('avert'); if(!b){ b=document.createElement('p'); b.id='avert'; b.className='astuce'; b.style.cssText='background:#FFE7DF;color:#8A3A22;border-radius:14px;padding:10px 14px'; document.querySelector('.lecture')?.appendChild(b); }
  b.textContent=msg;
}
let audioEnCours=null;
function stopAudio(){ if(audioEnCours){ audioEnCours.onended=null; audioEnCours.pause(); audioEnCours=null; } if(parle) speechSynthesis.cancel(); }
function lirePage(cle,txt,el,fini){
  stopAudio(); document.getElementById('avert')?.remove();
  const a=new Audio('audio/'+cle+'.mp3'); audioEnCours=a;
  const mots=el?[...el.querySelectorAll('.mot')]:[]; const total=txt.length; const cumul=[]; let c=0; mots.forEach(m=>{c+=m.textContent.length+1;cumul.push(c)});
  a.ontimeupdate=()=>{ if(!a.duration) return; const pos=(a.currentTime/(a.duration-0.3))*total; mots.forEach((m,i)=>m.classList.toggle('lu',cumul[i]-1<=pos)); };
  a.onended=()=>{ mots.forEach(m=>m.classList.add('lu')); if(audioEnCours===a) audioEnCours=null; fini&&fini(); };
  a.play().catch(()=>{ if(audioEnCours===a){ audioEnCours=null; el?lireTexte(txt,el,fini):fini&&fini(); } });
}
function lireTexte(txt,el,fini){
  if(!parle){avertir("Ce navigateur ne sait pas lire à voix haute. Essaie avec Chrome ou Safari à jour.");fini&&fini();return}
  if(speechSynthesis.speaking||speechSynthesis.pending) speechSynthesis.cancel();
  speechSynthesis.resume();
  const u=new SpeechSynthesisUtterance(txt.replace(/[«»]/g,'')); u.lang='fr-FR'; u.rate=.85; u.pitch=1.15; u.volume=1; if(voixFR) u.voice=voixFR;
  enCours=u; // garde une référence, sinon Chrome coupe la voix
  let demarre=false; u.onstart=()=>{demarre=true;document.getElementById('avert')?.remove()};
  u.onerror=e=>{ if(e.error!=='interrupted'&&e.error!=='canceled') avertir("La voix n’a pas pu démarrer ("+e.error+"). Vérifie que le son de l’appareil est allumé."); };
  setTimeout(()=>{ if(!demarre&&enCours===u) avertir(speechSynthesis.getVoices().length? "Pas de son ? Monte le volume, et sur iPhone/iPad désactive le mode silencieux." : "Aucune voix n’est installée sur cet appareil. Essaie dans Chrome ou Safari."); },2500);
  const mots=[...el.querySelectorAll('.mot')];
  u.onboundary=e=>{ if(e.name&&e.name!=='word')return; let n=0,pos=0; for(const m of mots){ if(pos<=e.charIndex) n++; pos+=m.textContent.length+1; } mots.forEach((m,i)=>m.classList.toggle('lu',i<n)); };
  u.onend=()=>{mots.forEach(m=>m.classList.add('lu'));fini&&fini()};
  setTimeout(()=>speechSynthesis.speak(u),80);
}

};
let auto=false;

function accueil(){
  stopAudio(); auto=false;
  app.innerHTML=`<header class="tete"><svg viewBox="140 30 420 340" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${DEFS}${dragon(330,250,2.6)}</svg>
    <div><h1>Les histoires de Pistache</h1><p>Choisis une histoire !</p></div></header>
    <section class="etageres">${HISTOIRES.map(h=>`<button class="livre" data-id="${h.id}" id="livre-${h.id}">${h.couverture()}<span>${h.titre}<small>${h.sous}</small></span></button>`).join('')}</section>
    <p class="astuce">Dans les histoires, touche Pistache, Biscotte ou le chaton pour les entendre.</p>`;
  app.querySelectorAll('.livre').forEach(b=>b.onclick=()=>{debloquerVoix();son('ding');ouvrir(b.dataset.id,0)});
}

function ouvrir(id,p){
  stopAudio();
  const h=HISTOIRES.find(x=>x.id===id); const n=h.pages.length;
  if(p>=n) return finale(h);
  const [txt,scene]=h.pages[p];
  app.innerHTML=`<div class="lecture">
    <div class="barre"><button class="rond" id="maison" aria-label="Retour aux histoires">${ic.maison}</button>
      <div class="points">${h.pages.map((_,i)=>`<i class="${i<=p?'on':''}"></i>`).join('')}</div>
      <button class="rond ${auto?'actif':''}" id="auto" aria-label="Lecture automatique">${ic.voix}</button></div>
    <div class="scene" id="scene">${svg(scene())}</div>
    <p class="texte" id="texte">${txt.split(' ').map(m=>`<span class="mot">${m}</span>`).join(' ')}</p>
    <div class="nav"><button class="fleche" id="prec" aria-label="Page précédente" ${p===0?'disabled':''}>${ic.gauche}</button>
      <button class="lire" id="lire">${ic.voix}Lis-moi</button>
      <button class="fleche" id="suiv" aria-label="Page suivante">${ic.droite}</button></div></div>`;
  const texte=document.getElementById('texte');
  document.getElementById('maison').onclick=accueil;
  document.getElementById('prec').onclick=()=>ouvrir(id,p-1);
  document.getElementById('suiv').onclick=()=>ouvrir(id,p+1);
  const lire=document.getElementById('lire'); if(lire) lire.onclick=()=>lirePage(id+'-'+p,txt,texte);
  document.getElementById('auto').onclick=()=>{auto=!auto; document.getElementById('auto').classList.toggle('actif',auto); if(auto) lirePage(id+'-'+p,txt,texte,()=>auto&&setTimeout(()=>auto&&ouvrir(id,p+1),900)); else stopAudio();};
  document.getElementById('scene').onclick=e=>{const t=e.target.closest('.touche'); if(!t) return; son(t.dataset.son); t.classList.remove('saute'); void t.getBBox; requestAnimationFrame(()=>t.classList.add('saute'));};
  if(auto) lirePage(id+'-'+p,txt,texte,()=>auto&&setTimeout(()=>auto&&ouvrir(id,p+1),900));
}

function finale(h){
  auto=false;
  app.innerHTML=`<div class="lecture">
    <div class="barre"><button class="rond" id="maison" aria-label="Retour aux histoires">${ic.maison}</button><div></div><div style="width:56px"></div></div>
    <div class="scene" id="scene">${svg(fond()+soleil()+nuage(140,70)+dragon(220,290,1.3,{flamme:true})+chienne(500,300,1.2)+bulles(330,170))}</div>
    <p class="texte">Fin ! Bravo, tu as écouté toute l’histoire, Noa !</p>
    <div class="fin"><button class="lire" id="encore">${ic.encore}Encore !</button><button class="lire" id="autre" style="background:var(--pistache);box-shadow:0 5px 0 var(--pistache-f)">Une autre histoire</button></div></div>`;
  stopAudio(); son('ding'); setTimeout(()=>lirePage(({noa:'noa-fin',dodo:'dodo-fin'})[h.id]||'fin','',null),500);
  document.getElementById('maison').onclick=accueil;
  document.getElementById('autre').onclick=accueil;
  document.getElementById('encore').onclick=()=>ouvrir(h.id,0);
  document.getElementById('scene').onclick=e=>{const t=e.target.closest('.touche'); if(t) son(t.dataset.son)};
}

document.addEventListener('keydown',e=>{ if(e.key==='ArrowRight') document.getElementById('suiv')?.click(); if(e.key==='ArrowLeft') document.getElementById('prec')?.click(); });
accueil();
